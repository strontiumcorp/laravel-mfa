name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The combinations that matter: minimum PHP + lowest dependencies for each
  # Laravel major; each app's real PHP/Laravel (artistly 8.3/L11, clone-voice
  # 8.4/L12, podcast-flow 8.4/L13, which also measures coverage); the newest
  # PHP. Kept under the plan's 20 concurrent jobs, so nothing waits for a
  # runner. Every combination runs in full-matrix.yml.
  tests:
    uses: ./.github/workflows/test-suite.yml
    with:
      matrix: >-
        {"include": [
          {"php": "8.2", "laravel": "11", "stability": "prefer-lowest"},
          {"php": "8.3", "laravel": "11", "stability": "prefer-stable"},
          {"php": "8.2", "laravel": "12", "stability": "prefer-lowest"},
          {"php": "8.4", "laravel": "12", "stability": "prefer-stable"},
          {"php": "8.3", "laravel": "13", "stability": "prefer-lowest"},
          {"php": "8.4", "laravel": "13", "stability": "prefer-stable", "coverage": true},
          {"php": "8.5", "laravel": "13", "stability": "prefer-stable"}
        ]}

  # What only a database server shows (tests/Database): MariaDB 10.6, whose
  # explicit_defaults_for_timestamp is off by default, as on many production
  # servers. artistly's PHP and Laravel.
  database:
    name: MariaDB 10.6 · PHP 8.3 · Laravel 11
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laravel_mfa_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MFA_TEST_DB_HOST: 127.0.0.1
      MFA_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, openssl
          coverage: none
      - run: composer config audit.block-insecure false
      - run: composer update --prefer-dist --no-interaction --no-progress -W --with "laravel/framework:^11.0" --with "orchestra/testbench:^9.0"
      - run: vendor/bin/pest --ci --testsuite=Database

  # The published React components and pages: tsc and Vitest.
  ui:
    uses: ./.github/workflows/ui-suite.yml

  quality:
    name: Static analysis & style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-quality-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-quality-
      # PHPStan's result cache: only changed files are re-analysed. Keyed per
      # commit, restored from the latest one.
      - uses: actions/cache@v6
        with:
          path: build/phpstan
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test --parallel
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
