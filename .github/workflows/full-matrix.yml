name: full matrix

# Every PHP x Laravel x dependency combination. Runs on release tags, on
# demand (Actions -> full matrix -> Run workflow), and nightly when main
# changed in the last day (a full run bills ~23 minutes).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Changed since yesterday?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq .commit.committer.date)
          if [ "$(date -d "$last" +%s)" -gt "$(date -d '25 hours ago' +%s)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits since $last; skipping the nightly run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/test-suite.yml
    with:
      matrix: >-
        {"php": ["8.2", "8.3", "8.4", "8.5"],
         "laravel": ["11", "12", "13"],
         "stability": ["prefer-lowest", "prefer-stable"],
         "exclude": [{"laravel": "13", "php": "8.2"}]}
